<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>K-Method by Tuan Khairi</title>
<meta name="robots" content="noindex">
<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzSCoRf_GjSHm_jopQDhBwHDrxy2JFSPjjNRlDfzXsAcNBni_zfbq6_rJGz2IIk3yLh-A/exec";
  const DEST = "https://k-method.tunkhairi.com/?ref=1022";

  // Ambil parameter sumber, cth: /k-method/?s=copyA
  const p = new URLSearchParams(window.location.search);
  const s = p.get("s") || "";
  const r = document.referrer || "";
  const trackUrl = GAS_URL + "?s=" + encodeURIComponent(s) + "&r=" + encodeURIComponent(r);

  // sendBeacon: hantar log TANPA tunggu respon, redirect terus
  if (navigator.sendBeacon) {
    navigator.sendBeacon(trackUrl);
  } else {
    fetch(trackUrl, { mode: "no-cors", keepalive: true });
  }

  window.location.replace(DEST);
</script>
</head>
<body>
<p style="font-family:sans-serif;text-align:center;margin-top:40px;">
  Sedang dibawa ke halaman K-Method...<br><br>
  <a href="https://k-method.tunkhairi.com/?ref=1022">Klik sini jika tidak redirect automatik</a>
</p>
</body>
</html>
