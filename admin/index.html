<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin — Ahmad Albab</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f2f2; --white:#ffffff; --text:#201e1d;
    --accent:#ec3013; --accent-600:#d02a10; --accent-700:#b8250e; --accent-800:#8f1c0b;
    --accent-100:#fce2dc; --accent-200:#f9c7ba;
    --n100:#f6f5f5; --n200:#eceaea; --n300:#d6d4d4; --n400:#b7b4b4;
    --n600:#8a8686; --n700:#6b6767; --n800:#4a4746; --n900:#1c1a19;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Archivo',sans-serif;}
  button,input,select,textarea{font-family:inherit;}
  a{color:var(--accent-700);text-decoration:none;}
  h1,h2{margin:0;font-family:'Archivo',sans-serif;}
  *:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:#fff;border:1px solid var(--n300);border-radius:16px;padding:32px;max-width:360px;width:100%;}
  .login-card h1{font-weight:800;font-size:22px;margin-bottom:8px;}
  .login-card p{font-size:13.5px;color:var(--n700);margin:0 0 20px;}
  .login-card input{width:100%;height:48px;border:1px solid var(--n300);border-radius:12px;padding:0 14px;font-size:15px;margin-bottom:12px;background:var(--bg);}
  .login-card button{width:100%;height:48px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;}
  .login-card button:hover{background:var(--accent-600);}
  .login-msg{font-size:13px;color:var(--accent-700);font-weight:600;margin-top:10px;min-height:18px;}

  header{position:sticky;top:0;z-index:20;background:rgba(243,242,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--n300);}
  .header-inner{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{width:34px;height:34px;border-radius:11px;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
  .brand-name{font-weight:700;font-size:16px;}
  .brand-sub{font-size:11.5px;color:var(--n700);}
  .range-seg{display:flex;gap:4px;padding:4px;border:1px solid var(--n300);border-radius:999px;background:#fff;}
  .range-seg button{height:34px;padding:0 13px;border-radius:999px;border:0;background:transparent;font-size:12.5px;font-weight:600;color:var(--n800);cursor:pointer;}
  .range-seg button.active{background:var(--accent);color:#fff;}
  .view-store{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--n300);background:#fff;font-size:13px;font-weight:600;color:var(--n800);}

  .layout{max-width:1320px;margin:0 auto;padding:24px 20px 56px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;}
  nav{width:232px;flex:none;display:flex;flex-direction:column;gap:2px;transition:width .2s ease;}
  nav.mini{width:64px;}
  .nav-collapse-btn{display:flex;align-items:center;gap:11px;width:100%;margin-bottom:4px;padding:9px 12px;border:0;border-bottom:1px solid var(--n200);border-radius:10px;background:transparent;color:var(--n700);font-size:12.5px;font-weight:600;cursor:pointer;}
  .nav-collapse-btn:hover{background:var(--n100);color:var(--text);}
  nav.mini .nav-collapse-btn{justify-content:center;padding:9px;}
  nav.mini .nav-collapse-btn .label{display:none;}
  nav.mini .navgroup{display:none;}
  nav.mini .navgroup-divider{display:block !important;height:1px;margin:8px 4px 4px;background:var(--n200);}
  nav.mini button.navlink{justify-content:center;padding:10px;}
  nav.mini button.navlink .navtext{display:none;}
  .nav-toggle{display:none;width:100%;height:46px;border-radius:12px;border:1px solid var(--n300);background:#fff;align-items:center;justify-content:space-between;padding:0 16px;font-size:13.5px;font-weight:700;margin-bottom:10px;}
  @media(max-width:880px){
    nav{width:100%;}
    .nav-toggle{display:flex;}
    #navList{display:none;background:#fff;border:1px solid var(--n300);border-radius:12px;padding:8px;}
    #navList.open{display:flex;flex-direction:column;}
  }
  nav button.navlink{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--n800);}
  nav button.navlink.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06);}
  nav button.navlink .ic{width:26px;height:26px;border-radius:8px;background:var(--n200);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;}
  nav .navgroup{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--n700);margin:14px 0 4px 12px;}
  nav .navgroup:first-child{margin-top:0;}

  main{flex:1 1 520px;min-width:min(100%,320px);}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
  .kpi-card{background:#fff;border:1px solid var(--n300);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;}
  .kpi-label{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--n700);}
  .kpi-value{margin:0;font-weight:800;font-size:30px;letter-spacing:-.02em;}

  .panel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px;}
  .panel{background:#fff;border:1px solid var(--n300);border-radius:16px;padding:20px;}
  .panel h2{font-weight:700;font-size:16px;letter-spacing:-.01em;}
  .bars{margin-top:18px;display:flex;align-items:flex-end;gap:6px;height:160px;overflow-x:auto;padding-bottom:4px;}
  .bar-col{flex:0 0 34px;width:34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;height:100%;}
  .bar-val{font-size:10.5px;font-weight:700;color:var(--n700);}
  .bar-fill{width:100%;border-radius:6px 6px 0 0;background:var(--accent);min-height:2px;}
  .bar-day{font-size:11px;font-weight:600;color:var(--n700);}

  .channel-row{display:flex;flex-direction:column;gap:8px;}
  .channel-top{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;}
  .channel-name{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .track{height:10px;border-radius:999px;background:var(--n200);overflow:hidden;}
  .track-fill{height:100%;border-radius:999px;}
  .channel-note{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--n200);font-size:13px;color:var(--n700);}

  .table-panel{margin-top:16px;background:#fff;border:1px solid var(--n300);border-radius:16px;overflow:hidden;}
  .table-head{padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--n200);}
  .table-head p{margin:6px 0 0;font-size:13px;color:var(--n700);}
  table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px;}
  th{background:var(--n100);font-size:11.5px;font-weight:700;text-transform:uppercase;text-align:left;padding:12px 20px;border-bottom:1px solid var(--n300);}
  td{padding:14px 20px;border-bottom:1px solid var(--n200);}
  .kind-pill{border-radius:999px;font-size:11px;font-weight:700;padding:4px 10px;color:#fff;}

  .help-panel{margin-top:16px;background:var(--n100);border:1px solid var(--n300);border-radius:16px;padding:20px;}
  .help-panel p{margin:8px 0 0;font-size:13px;line-height:1.6;color:var(--n800);max-width:76ch;}

  .form-card{background:#fff;border:1px solid var(--n300);border-radius:16px;padding:24px;}
  .form-card h2{font-weight:800;font-size:clamp(19px,2.2vw,24px);letter-spacing:-.02em;}
  .form-card > p.note{margin:8px 0 0;font-size:13.5px;color:var(--n700);max-width:70ch;}
  .field-grid{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.wide{grid-column:1/-1;}
  .field label{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--n700);}
  .field input[type=text], .field input[type=url], .field input[type=number]{height:46px;border:1px solid var(--n300);border-radius:12px;padding:0 14px;font-size:14.5px;background:var(--bg);outline:none;}
  .field textarea{border:1px solid var(--n300);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.55;background:var(--bg);outline:none;resize:vertical;}
  .field select{height:46px;border:1px solid var(--n300);border-radius:12px;padding:0 12px;font-size:14.5px;font-weight:600;background:var(--bg);}
  .toggle-btn{height:46px;border-radius:999px;border:1px solid var(--n300);background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer;width:fit-content;}
  .toggle-track{width:34px;height:20px;border-radius:999px;background:var(--n300);position:relative;transition:.16s;flex:none;}
  .toggle-track .knob{width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:.16s;}
  .toggle-btn.on{border-color:var(--accent);background:var(--accent-100);}
  .toggle-btn.on .toggle-track{background:var(--accent);}
  .toggle-btn.on .toggle-track .knob{left:17px;}
  .slug-row{display:flex;align-items:center;border:1px solid var(--n300);border-radius:12px;background:var(--bg);overflow:hidden;height:46px;}
  .slug-prefix{padding:0 10px;font-size:12.5px;color:var(--n700);white-space:nowrap;}
  .slug-row input{border:0;background:transparent;flex:1;min-width:0;padding:0 10px 0 0;font-size:14px;outline:none;}
  .img-row{display:flex;align-items:center;gap:10px;}
  .img-thumb{width:88px;height:56px;border-radius:8px;background:var(--n200);flex:none;background-size:cover;background-position:center;}

  .form-footer{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .btn-save{height:48px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn-save svg, .btn-clear svg, .btn-delete svg, button svg, a svg{display:block;flex:none;}
  .btn-save:hover{background:var(--accent-600);}
  .btn-clear{height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--n300);background:#fff;font-size:14px;font-weight:600;color:var(--n800);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-family:inherit;line-height:1;}
  .form-status{font-size:13px;font-weight:600;color:var(--accent-700);}

  .entries-list{margin-top:16px;background:#fff;border:1px solid var(--n300);border-radius:16px;overflow:hidden;}
  .entry-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--n200);}
  .entry-row:last-child{border-bottom:0;}
  .entry-title{font-weight:700;font-size:14px;}
  .entry-meta{font-size:12.5px;color:var(--n700);margin-top:3px;}
  .btn-delete{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--n300);background:#fff;font-size:12.5px;font-weight:600;color:var(--n800);cursor:pointer;flex:none;}
  .btn-delete:hover{background:var(--accent-100);border-color:var(--accent);color:var(--accent-700);}
  .entries-empty{padding:32px;text-align:center;font-size:13.5px;color:var(--n700);}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <p style="margin:0 0 8px;font-weight:800;font-size:22px;">Panel Admin</p>
    <p>Ahmad Albab · masukkan password untuk urus kandungan store.</p>
    <input type="password" id="loginPassword" placeholder="Password admin">
    <button type="button" id="loginBtn">Log masuk</button>
    <p class="login-msg" id="loginMsg"></p>
  </div>
</div>

<div id="adminApp" style="display:none;">
  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="../favicon.svg" alt="Logo Ahmad Albab" width="34" height="34" style="display:block;width:34px;height:34px;flex:none;border-radius:9px;">
        <span style="font-weight:800;font-size:20px;line-height:1;letter-spacing:-.035em;text-transform:lowercase;white-space:nowrap;">ahmadalbab<span style="color:var(--accent);">.</span></span>
        <span style="flex:none;width:1px;height:26px;background:var(--n300);"></span>
        <div>
          <div class="brand-name" style="font-size:15px;">Panel Admin</div>
          <div class="brand-sub">Tracking klik affiliate</div>
        </div>
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
        <div class="range-seg" id="rangeSeg"></div>
        <a href="../index.html" class="view-store">Lihat store</a>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav id="navEl">
      <button type="button" class="nav-toggle" id="navToggle">
        <span id="navToggleLabel">Menu</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <button type="button" class="nav-collapse-btn" id="navCollapseBtn" onclick="toggleNavMini()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex:none;"><path id="navCollapseIcon" d="M15 18l-6-6 6-6M4 4v16"></path></svg>
        <span class="label" id="navCollapseLabel">Kecilkan menu</span>
      </button>
      <div id="navList"></div>
    </nav>
    <main id="mainArea"></main>
  </div>
</div>

<script>
// ====== CONFIG ======
const API_URL = "https://script.google.com/macros/s/AKfycbx0d9SD9yEU8_KwP1R5TbXiPfSnXOEaOIVE20qA4J6peoXtRwR87ox9bTWtPAiqz3eY8A/exec";

let TOKEN = sessionStorage.getItem("aab_admin_token") || "";
let currentView = "dashboard";
let navMini = false;
let rangeDays = 7;
let contentCache = {}; // type -> items[]
let settingsCache = { game:{}, site:{}, connect:{} };
let editingType = null;
let editingId = null;

const NAV = [
  { group: "Umum", items: [
    { key:"dashboard", label:"Dashboard", initial:"D", hint:"Tracking klik" },
    { key:"review", label:"Post Review", initial:"P", hint:"Bahan untuk slaid" }
  ]},
  { group: "Ikut susunan halaman", items: [
    { key:"hero", label:"1 · Hero Slider", initial:"1", hint:"Slaid paling atas" },
    { key:"product", label:"2 · Add Product", initial:"2", hint:"Grid Pilihan Terlaris" },
    { key:"game", label:"3 · Teka Harga", initial:"3", hint:"Setting game" },
    { key:"site", label:"4 · Langgan Review", initial:"4", hint:"Gambar muka" },
    { key:"digital", label:"5 · Other Product", initial:"5", hint:"Produk digital" }
  ]},
  { group: "Tetapan", items: [
    { key:"category", label:"Kategori Produk", initial:"K", hint:"Tambah / buang" },
    { key:"articleTag", label:"Kategori Artikel", initial:"A", hint:"Tambah / buang" },
    { key:"shorturls", label:"Pautan Pendek", initial:"P", hint:"Senarai & klik" },
    { key:"connect", label:"Sambungan", initial:"S", hint:"Brevo, Telegram, data" }
  ]}
];

const FIELD_DEFS = {
  review: [
    { key:"title", label:"Tajuk review", type:"text", required:true },
    { key:"tag", label:"Kategori", type:"select", options:["Panduan","Ulasan","Tips jimat"], dynamic:"articleTag" },
    { key:"readTime", label:"Masa bacaan", type:"text", placeholder:"5 min bacaan" },
    { key:"excerpt", label:"Ringkasan (dipaparkan sebagai kad)", type:"area", wide:true },
    { key:"body", label:"Kandungan penuh artikel", type:"area", wide:true },
    { key:"image", label:"Gambar utama 1200×675 (16:9, di bawah 300KB)", type:"image", wide:true },
    { key:"authorName", label:"Nama author (kosong = Ahmad Albab)", type:"text", placeholder:"Ahmad Albab" },
    { key:"authorImage", label:"Gambar author (bulat)", type:"image" },
    { key:"authorBio", label:"Bio author", type:"area", wide:true, placeholder:"Cth: Penulis review produk sejak 2023. Ikuti saya untuk tips beli-belah pandai." },
    { key:"authorLink", label:"Link bio (contoh: Instagram, TikTok, website)", type:"text", wide:true, placeholder:"https://…" },
    { key:"slug", label:"Slug", type:"slug" }
  ],
  hero: [
    { key:"kicker", label:"Kicker", type:"text" },
    { key:"readTime", label:"Label kecil", type:"text" },
    { key:"title", label:"Tajuk slaid", type:"text", required:true },
    { key:"excerpt", label:"Ringkasan", type:"area", wide:true },
    { key:"cta", label:"Teks butang CTA", type:"text", placeholder:"Baca sebelum beli" },
    { key:"href", label:"Link slaid", type:"text" },
    { key:"image", label:"Gambar latar 1600×900 (16:9, di bawah 400KB)", type:"image", wide:true }
  ],
  product: [
    { key:"title", label:"Nama produk", type:"text", required:true },
    { key:"platform", label:"Platform", type:"select", options:["Shopee","TikTok"] },
    { key:"category", label:"Kategori", type:"select", options:["Makanan","Baju Muslimah","Barang Rumah"], dynamic:"category" },
    { key:"price", label:"Harga", type:"text", placeholder:"24.90" },
    { key:"old", label:"Harga asal", type:"text", placeholder:"32.00" },
    { key:"sold", label:"Jumlah terjual", type:"text", placeholder:"1800" },
    { key:"link", label:"Link affiliate", type:"text", wide:true },
    { key:"image", label:"Gambar produk 800×800 (1:1, di bawah 200KB)", type:"image", wide:true },
    { key:"hot", label:"Tanda terlaris", type:"toggle" }
  ],
  category: [
    { key:"title", label:"Nama kategori", type:"text", required:true }
  ],
  articleTag: [
    { key:"title", label:"Nama kategori", type:"text", required:true }
  ],
  digital: [
    { key:"brand", label:"Nama brand", type:"text", required:true },
    { key:"kicker", label:"Badge", type:"text" },
    { key:"title", label:"Tajuk tawaran", type:"text" },
    { key:"desc", label:"Penerangan", type:"area", wide:true },
    { key:"price", label:"Harga", type:"text", placeholder:"RM59" },
    { key:"old", label:"Harga asal", type:"text", placeholder:"RM99" },
    { key:"badge", label:"Label jimat", type:"text", placeholder:"Jimat 40%" },
    { key:"cta", label:"Teks butang", type:"text" },
    { key:"points", label:"Poin jualan (satu setiap baris)", type:"area", wide:true },
    { key:"link", label:"Link affiliate", type:"text", wide:true },
    { key:"image", label:"Poster produk 1000×1250 (4:5, di bawah 300KB)", type:"image", wide:true }
  ]
};

// ====== API HELPERS ======
function apiGet(params){
  return fetch(API_URL + "?" + new URLSearchParams(params).toString()).then(r=>r.json());
}
function apiPost(body){
  return fetch(API_URL, { method:"POST", body: JSON.stringify(body) }).then(r=>r.json()).then(d=>{
    if(d && d.success===false && /sesi tamat/i.test(d.message||"")){
      TOKEN = ""; sessionStorage.removeItem("aab_admin_token");
      document.getElementById("adminApp").style.display = "none";
      document.getElementById("loginScreen").style.display = "flex";
      document.getElementById("loginMsg").textContent = "Sesi tamat, sila log masuk semula.";
    }
    return d;
  });
}

// ====== LOGIN ======
document.getElementById("loginBtn").addEventListener("click", doLogin);
document.getElementById("loginPassword").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
function doLogin(){
  const pw = document.getElementById("loginPassword").value;
  const msg = document.getElementById("loginMsg");
  if(!API_URL){ msg.textContent = "API_URL belum diisi dalam admin.html."; return; }
  msg.textContent = "Menyemak…";
  apiPost({ action:"login", password: pw }).then(d=>{
    if(d && d.success){
      TOKEN = d.token;
      sessionStorage.setItem("aab_admin_token", TOKEN);
      showApp();
    } else {
      msg.textContent = (d && d.message) || "Log masuk gagal.";
    }
  }).catch(()=>{ msg.textContent = "Ralat sambungan ke server."; });
}

function showApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("adminApp").style.display = "block";
  document.getElementById("navToggleLabel").textContent = "Dashboard";
  renderNav();
  renderRangeSeg();
  loadAllSettingsAndContent().then(()=>renderView());
}

if(TOKEN && API_URL){
  apiPost({ action:"checkToken", token: TOKEN }).then(d=>{
    if(d && d.success) showApp();
    else { TOKEN=""; sessionStorage.removeItem("aab_admin_token"); }
  }).catch(()=>{ TOKEN=""; sessionStorage.removeItem("aab_admin_token"); });
}
else if(!API_URL) document.getElementById("loginMsg").textContent = "Isi API_URL dalam fail admin.html dahulu.";

// ====== NAV ======
function renderNav(){
  const nav = document.getElementById("navList");
  let html = "";
  NAV.forEach((group,gi)=>{
    html += `<div class="navgroup">${group.group}</div>`;

    </section>`;

function loadDashboard(){
  apiGet({action:"getClicks", range:rangeDays}).then(d=>{
    if(!d || !d.success) return;
    const totalClicks = d.days.reduce((s,x)=>s+x.total,0);
    const kpi = [
      { label:"Jumlah klik", value: totalClicks },
      { label:"Shopee", value: d.byKind.shopee||0 },
      { label:"TikTok", value: d.byKind.tiktok||0 },
      { label:"Produk digital", value: d.byKind.digital||0 }
    ];
    document.getElementById("kpiGrid").innerHTML = kpi.map(k=>`
      <article class="kpi-card"><p class="kpi-label">${k.label}</p><p class="kpi-value">${k.value}</p></article>`).join("");

    const maxDay = Math.max(1, ...d.days.map(x=>x.total));
    document.getElementById("barsArea").innerHTML = d.days.map(x=>`
      <div class="bar-col">
        <span class="bar-val">${x.total}</span>
        <div class="bar-fill" style="height:${Math.max(4,(x.total/maxDay)*100)}%;"></div>
        <span class="bar-day">${x.date.slice(5)}</span>
      </div>`).join("");

    const kinds = [["shopee","Shopee","#ec3013"],["tiktok","TikTok","#1c1a19"],["digital","Digital","#b8250e"]];
    const kindTotal = Math.max(1, (d.byKind.shopee||0)+(d.byKind.tiktok||0)+(d.byKind.digital||0));
    document.getElementById("channelArea").innerHTML = kinds.map(([k,label,color])=>{
      const v = d.byKind[k]||0;
      const pct = Math.round((v/kindTotal)*100);
      return `<div class="channel-row">
        <div class="channel-top"><span class="channel-name"><span class="dot" style="background:${color};"></span>${label}</span><span style="font-size:13px;color:var(--n700);">${v} klik · ${pct}%</span></div>
        <div class="track"><div class="track-fill" style="width:${pct}%;background:${color};"></div></div>
      </div>`;
    }).join("");
    const top = kinds.map(([k,l])=>({k:l,v:d.byKind[k]||0})).sort((a,b)=>b.v-a.v)[0];
    document.getElementById("channelNote").textContent = top && top.v ? top.k + " memimpin klik dalam tempoh ini." : "Belum cukup data untuk insight.";

    const rows = d.byProduct.slice(0,12);
    const totalP = rows.reduce((s,r)=>s+r.clicks,0) || 1;
    document.getElementById("clicksTbody").innerHTML = rows.map(r=>{
      const color = r.kind==="shopee" ? "#ec3013" : r.kind==="tiktok" ? "#1c1a19" : "#b8250e";
      return `<tr>
        <td style="font-weight:600;">${r.label||r.id}</td>
        <td><span class="kind-pill" style="background:${color};">${r.kind}</span></td>
        <td style="text-align:right;font-weight:800;">${r.clicks}</td>
        <td style="text-align:right;color:var(--n700);">${Math.round((r.clicks/totalP)*100)}%</td>
      </tr>`;
    }).join("");
    document.getElementById("clicksEmpty").style.display = rows.length ? "none" : "block";
  }).catch(()=>{});
}

function cancelEdit(type){
  editingType = null; editingId = null;
  document.getElementById("saveBtnLabel").textContent = "Simpan";
  document.getElementById("cancelEditBtn").style.display = "none";
  document.getElementById("editingBanner").innerHTML = "";
  renderFields(document.getElementById("fieldGrid"), FIELD_DEFS[type], {});
  renderEntries(type);
}

function deleteListItem(type, id){
  apiPost({ action:"deleteItem", token: TOKEN, type, id }).then(d=>{
    if(d && d.success){
      contentCache[type] = (contentCache[type]||[]).filter(x=>x.id!==id);
      if(editingType===type && editingId===id) cancelEdit(type);
      else renderEntries(type);
    }
  });
}

function saveListItem(type){
  const item = collectFields(document.getElementById("fieldGrid"));
  if(FIELD_DEFS[type].some(f=>f.required) && !item[FIELD_DEFS[type].find(f=>f.required).key]){
    document.getElementById("formStatus").textContent = "Isi tajuk dulu sebelum simpan.";
    return;
  }
  if(type === "review" && !item.slug){
    item.slug = slugify(item.title||"");
  }
  if(editingType===type && editingId){ item.id = editingId; }
  apiPost({ action:"saveItem", token: TOKEN, type, item }).then(d=>{
    if(d && d.success){
      contentCache[type] = contentCache[type] || [];
      const idx = contentCache[type].findIndex(x=>x.id===d.item.id);
      if(idx>-1) contentCache[type][idx] = d.item; else contentCache[type].unshift(d.item);
      document.getElementById("formStatus").textContent = "Tersimpan.";
      cancelEdit(type);
    } else {
      document.getElementById("formStatus").textContent = (d&&d.message)||"Gagal simpan.";
    }
  });
}

function slugify(s){
  return String(s).toLowerCase().replace(/[^a-z0-9\s-]/g,"").trim().replace(/\s+/g,"-").replace(/-+/g,"-").slice(0,60);
}

// ====== FIELD RENDERING ======
function renderFields(container, fields, data){
  container.innerHTML = fields.map(f=>{
    const val = data[f.key] !== undefined ? data[f.key] : (f.type==="toggle" ? (f.key==="enabled"||f.key==="showBuy") : "");
    const wide = f.wide ? "wide" : "";
    if(f.type === "text"){
      return `<div class="field ${wide}"><label>${f.label}</label><input type="text" data-key="${f.key}" value="${escapeAttr(val)}" placeholder="${f.placeholder||''}"></div>`;
    }
    if(f.type === "area"){
      return `<div class="field ${wide}"><label>${f.label}</label><textarea data-key="${f.key}" rows="3" placeholder="${escapeAttr(f.placeholder||'')}">${escapeHtml(val)}</textarea></div>`;
    }
    if(f.type === "select"){
      let opts = f.options;
      if(f.dynamic === "category" && (contentCache.category||[]).length){
        opts = contentCache.category.map(c=>c.title);
      }
      if(f.dynamic === "articleTag" && (contentCache.articleTag||[]).length){
        opts = contentCache.articleTag.map(c=>c.title);
      }
      return `<div class="field ${wide}"><label>${f.label}</label><select data-key="${f.key}">${opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join("")}</select></div>`;
    }
    if(f.type === "toggle"){
      const on = val === true || val === "true";
      return `<div class="field ${wide}"><label>${f.label}</label>
        <button type="button" class="toggle-btn ${on?'on':''}" data-key="${f.key}" data-toggle="${on}" onclick="flipToggle(this)">
          <span class="toggle-track"><span class="knob"></span></span><span>${on?'Hidup':'Mati'}</span>
        </button></div>`;
    }
    if(f.type === "image"){
      return `<div class="field ${wide}"><label>${f.label}</label>
        <div class="img-row">
          <div class="img-thumb" data-preview style="${val?`background-image:url('${val}')`:''}"></div>
          <input type="text" data-key="${f.key}" value="${escapeAttr(val)}" placeholder="URL gambar" style="flex:1;height:38px;border:1px solid var(--n300);border-radius:8px;padding:0 10px;font-size:13px;" oninput="updateImgPreview(this)">
        </div></div>`;
    }
    if(f.type === "slug"){
      return `<div class="field ${wide}"><label>${f.label}</label>
        <div class="slug-row"><span class="slug-prefix">ahmadalbab.store/artikel/</span><input type="text" data-key="${f.key}" value="${escapeAttr(val)}"></div></div>`;
    }
    return "";
  }).join("");
}

function collectFields(container){
  const out = {};
  container.querySelectorAll("[data-key]").forEach(el=>{
    const key = el.dataset.key;
    if(el.classList.contains("toggle-btn")) out[key] = el.dataset.toggle === "true";
    else out[key] = el.value;
  });
  return out;
}
function flipToggle(btn){
  const on = btn.dataset.toggle !== "true";
  btn.dataset.toggle = on;
  btn.classList.toggle("on", on);
  btn.querySelector("span:last-child").textContent = on ? "Hidup" : "Mati";
}
function updateImgPreview(input){
  const row = input.closest(".img-row");
  row.querySelector("[data-preview]").style.backgroundImage = `url('${input.value}')`;
}
function escapeAttr(s){ return String(s==null?"":s).replace(/"/g,"&quot;"); }
function escapeHtml(s){ return String(s==null?"":s).replace(/</g,"&lt;"); }
</script>
</body>
</html>
