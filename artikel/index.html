<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Artikel & Ulasan — Ahmad Albab</title>
<meta name="description" id="pageDesc" content="Panduan beli-belah dan ulasan jujur sebelum anda checkout — dari Ahmad Albab.">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" id="pageCanonical" href="https://ahmadalbab.store/artikel/">
<meta property="og:type" id="ogType" content="website">
<meta property="og:site_name" content="Ahmad Albab">
<meta property="og:locale" content="ms_MY">
<meta property="og:url" id="ogUrl" content="https://ahmadalbab.store/artikel/">
<meta property="og:title" id="ogTitle" content="Artikel & Ulasan — Ahmad Albab">
<meta property="og:description" id="ogDesc" content="Panduan beli-belah dan ulasan jujur sebelum anda checkout.">
<meta name="theme-color" content="#ec3013">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<script type="application/ld+json" id="jsonLd">{}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <a href="../index.html" style="display:flex;align-items:center;gap:10px;">
      <img src="../favicon.svg" alt="Logo Ahmad Albab" width="40" height="40" style="display:block;width:40px;height:40px;flex:none;border-radius:11px;">
      <span style="display:flex;flex-direction:column;gap:3px;">
        <span class="wordmark">ahmadalbab<span style="color:var(--accent);">.</span></span>
        <span style="font-size:11.5px;font-weight:500;color:var(--n700);">Review Produk Shopee &amp; Tiktok Untuk Anda!</span>
      </span>
    </a>
    <button type="button" class="hamburger-btn" id="menuToggle" aria-label="Buka menu">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <div id="headerNav">
      <a href="../index.html#produk" class="back-store">Produk pilihan</a>
      <a href="../index.html#langgan" style="display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;">Dapatkan Review Terkini</a>
    </div>
  </div>
</header>

<main id="app" class="wrap"><p class="state-msg">Memuatkan…</p></main>

<footer>
  <div class="wrap footer-row">
    <div class="footer-meta">
      <p style="margin:0;">© <span id="year"></span> Ahmad Albab. Hak Cipta Terpelihara.</p>
      <p style="margin:0;">No. Pendaftaran SSM: 202603001066 (CT0159040-U)</p>
    </div>
    <nav aria-label="Navigasi footer" class="footer-links">
      <a href="../index.html#produk">Produk terlaris</a>
      <a href="../index.html#digital">Produk digital</a>
      <a href="./">Semua artikel</a>
    </nav>
  </div>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx0d9SD9yEU8_KwP1R5TbXiPfSnXOEaOIVE20qA4J6peoXtRwR87ox9bTWtPAiqz3eY8A/exec";
document.getElementById("year").textContent = new Date().getFullYear();

const CATS = ["Semua","Panduan","Ulasan","Tips jimat"];
let ALL_REVIEWS = [];
let DIGITAL_LINKS = [];
let listState = { cat:"Semua", q: new URLSearchParams(location.search).get("q") || "", page:1, perPage:4 };

function setHeaderNav(mode){
  const link = document.querySelector("#headerNav .back-store");
  if(mode === "article"){ link.textContent = "Semua artikel"; link.setAttribute("href", "./"); }
  else { link.textContent = "Produk pilihan"; link.setAttribute("href", "../index.html#produk"); }
}

function esc(s){ return String(s==null?"":s).replace(/</g,"&lt;"); }

document.getElementById("menuToggle").addEventListener("click", ()=>{
  document.getElementById("headerNav").classList.toggle("open");
});
document.getElementById("headerNav").addEventListener("click", e=>{
  if(e.target.closest("a,button")) document.getElementById("headerNav").classList.remove("open");
});
function slugParam(){ return new URLSearchParams(location.search).get("review"); }

function setMeta({title, desc, canonical, ogType, jsonLd}){
  document.getElementById("pageTitle").textContent = title;
  document.getElementById("pageDesc").setAttribute("content", desc);
  document.getElementById("ogTitle").setAttribute("content", title);
  document.getElementById("ogDesc").setAttribute("content", desc);
  document.getElementById("pageCanonical").setAttribute("href", canonical);
  document.getElementById("ogUrl").setAttribute("content", canonical);
  document.getElementById("ogType").setAttribute("content", ogType);
  document.getElementById("jsonLd").textContent = JSON.stringify(jsonLd);
}

function paragraphs(text){
  return (text||"").split(/\n+/).filter(p=>p.trim()).map(p=>`<p>${esc(p)}</p>`).join("") || "<p>Kandungan penuh belum ditambah lagi.</p>";
}

// ====================== LIST VIEW ======================
function filteredReviews(){
  let list = ALL_REVIEWS.slice();
  if(listState.cat !== "Semua") list = list.filter(r=>r.tag===listState.cat);
  const q = listState.q.trim().toLowerCase();
  if(q) list = list.filter(r=>(r.title+" "+r.excerpt+" "+r.tag).toLowerCase().includes(q));
  return list;
}

function renderList(){
  setHeaderNav("list");
  setMeta({
    title:"Artikel & Ulasan — Ahmad Albab",
    desc:"Panduan beli-belah dan ulasan jujur sebelum anda checkout — dari Ahmad Albab.",
    canonical:"https://ahmadalbab.store/artikel/",
    ogType:"website",
    jsonLd:{"@context":"https://schema.org","@type":"CollectionPage","name":"Artikel & Ulasan","url":"https://ahmadalbab.store/artikel/",
      "mainEntity":{"@type":"ItemList","itemListElement":ALL_REVIEWS.map((r,i)=>({"@type":"ListItem","position":i+1,"url":"https://ahmadalbab.store/artikel/"+encodeURIComponent(r.slug||"")+"/","name":r.title}))}}
  });

  const all = filteredReviews();
  const total = all.length;
  const from = (listState.page-1)*listState.perPage;
  const pageItems = all.slice(from, from+listState.perPage);
  const pageCount = Math.max(1, Math.ceil(total/listState.perPage));

  let countLine;
  if(listState.q.trim()) countLine = total + " hasil carian";
  else if(listState.cat !== "Semua") countLine = total + " artikel dalam " + listState.cat;
  else if(total > listState.perPage) countLine = "Menunjukkan " + (from+1) + "–" + Math.min(from+listState.perPage,total) + " daripada " + total + " artikel";
  else countLine = total + " artikel";

  const digitalLinksHtml = DIGITAL_LINKS.length ? DIGITAL_LINKS.map(d=>`
    <li><a href="${d.link}" target="_blank" rel="noopener nofollow sponsored"><span>${esc(d.brand||d.title)}<span class="sub">${esc(d.kicker||"Produk digital")} · ${esc(d.price||"")}</span></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex:none;margin-top:2px;"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
    </a></li>`).join("") : `<li style="font-size:13px;color:var(--n700);">Belum ada produk digital.</li>`;

  const emptyTitle = listState.q.trim() ? "Tiada hasil carian" : (listState.cat!=="Semua" ? "Tiada artikel dalam kategori ini" : "Belum ada artikel lagi");
  const emptyBody = listState.q.trim() ? "Cuba perkataan lain, atau lihat semua artikel yang ada." : (listState.cat!=="Semua" ? "Cuba pilih kategori lain, atau lihat semua artikel yang ada." : "Kami sedang menulis ulasan pertama. Langgan review terkini supaya anda tahu sebaik ia keluar.");
  const listHtml = !pageItems.length ? `
    <div class="empty-card">
      <div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div>
      <h2>${emptyTitle}</h2>
      <p>${emptyBody}</p>
      <button class="btn-primary" onclick="resetListFilters()">Tunjuk semua artikel</button>
    </div>` : `
    <ol class="art-list">
      ${pageItems.map(r=>`
      <li><article class="artrow">
        <a class="art-img-link" href="${encodeURIComponent(r.slug||'')}/" aria-hidden="true" tabindex="-1">
          ${r.image ? `<img src="${r.image}" alt="${esc(r.title)}" width="400" height="300" loading="lazy">` : `<div class="art-noimg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg><span>Tiada gambar</span></div>`}
        </a>
        <div class="art-body">
          <div class="art-meta-row"><span class="art-tag">${esc(r.tag||"Panduan")}</span><span class="art-time">${esc(r.readTime||"")}</span></div>
          <h2 class="art-title"><a href="${encodeURIComponent(r.slug||'')}/">${esc(r.title)}</a></h2>
          <p class="art-excerpt">${esc(r.excerpt||"")}</p>
          <a class="art-cta" href="${encodeURIComponent(r.slug||'')}/">Baca sekarang</a>
        </div>
      </article></li>`).join("")}
    </ol>
    ${pageCount>1 ? `
    <nav aria-label="Navigasi halaman" class="page-nav">
      <p class="page-info">Halaman ${listState.page} daripada ${pageCount}</p>
      <div class="page-controls">
        <button class="page-arrow" ${listState.page<=1?'disabled':''} onclick="listState.page--;renderList();"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="m15 18-6-6 6-6"></path></svg></button>
        ${Array.from({length:pageCount},(_,i)=>i+1).map(n=>`<button class="page-pill" ${n===listState.page?'aria-current="page"':''} onclick="listState.page=${n};renderList();">${n}</button>`).join("")}
        <button class="page-arrow" ${listState.page>=pageCount?'disabled':''} onclick="listState.page++;renderList();"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="m9 18 6-6-6-6"></path></svg></button>
      </div>
    </nav>` : ""}`;

  document.getElementById("app").innerHTML = `
    <div class="page-head">
      <h1>Artikel &amp; Ulasan</h1>
      <p>Panduan beli-belah dan ulasan jujur sebelum anda checkout.</p>
      <div class="filter-row">
        <nav aria-label="Tapis ikut kategori" class="cat-pills">
          ${CATS.map(c=>`<button class="cat-pill" aria-pressed="${listState.cat===c}" onclick="setListCat('${c}')">${c}</button>`).join("")}
        </nav>
        <span class="count-line">${countLine}</span>
      </div>
    </div>
    <div class="body-grid">
      <main>${listHtml}</main>
      <aside>
        <div class="side-card">
          <h2>Cari Artikel</h2>
          <form role="search" class="search-pill" onsubmit="return false;">
            <input type="text" id="listSearch" aria-label="Cari artikel" placeholder="Cari tajuk atau topik…" value="${esc(listState.q)}" oninput="onListSearch(this.value)">
            <button type="button" class="search-clear" id="searchClearBtn" aria-label="Kosongkan carian" onclick="onListSearch('')">✕</button>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          </form>
        </div>
        <div class="side-card">
          <h2>Tentang ahmadalbab</h2>
          <p>Kami tapis produk Shopee dan TikTok Shop ikut rating, jumlah jualan dan ulasan pembeli sebenar — supaya anda tak perlu teka sebelum checkout.</p>
          <p>Setiap artikel di sini ditulis untuk satu tujuan: bantu anda buat keputusan dalam dua minit.</p>
          <a class="outline-link" href="../index.html#produk">Lihat pilihan kami</a>
        </div>
        <div class="side-card">
          <h2>Pautan Berguna</h2>
          <p style="margin-bottom:10px;">Kelas dan panduan digital yang kami syorkan.</p>
          <ul class="digital-list">${digitalLinksHtml}</ul>
          <a class="outline-link" href="../index.html#digital">Semua produk digital</a>
        </div>
        <div class="side-card request-card">
          <h2>Request Review Produk</h2>
          <p>Ada produk yang anda teringin tahu berbaloi atau tidak? Beritahu kami — atau hantar ulasan anda sendiri untuk diterbitkan di sini.</p>
          <a class="btn-email" href="mailto:hello@ahmadalbab.store">Hantar melalui emel</a>
        </div>
      </aside>
    </div>`;
  const clearBtn = document.getElementById("searchClearBtn");
  if(clearBtn) clearBtn.style.display = listState.q ? "flex" : "none";
}
function setListCat(c){ listState.cat = c; listState.page = 1; renderList(); }
function onListSearch(v){ listState.q = v; listState.page = 1; renderList(); document.getElementById("listSearch").focus(); }
function resetListFilters(){ listState.cat="Semua"; listState.q=""; listState.page=1; renderList(); }

// ====================== SINGLE ARTICLE VIEW ======================
function renderArticle(item){
  setHeaderNav("article");
  setMeta({
    title:item.title + " — Ahmad Albab",
    desc:item.excerpt || item.title,
    canonical:"https://ahmadalbab.store/artikel/"+encodeURIComponent(item.slug||"")+"/",
    ogType:"article",
    jsonLd:{"@context":"https://schema.org","@graph":[
      {"@type":"Article","headline":item.title,"description":item.excerpt||"","author":{"@type":"Organization","name":"Ahmad Albab"},"datePublished":"","dateModified":""},
      {"@type":"BreadcrumbList","itemListElement":[
        {"@type":"ListItem","position":1,"name":"Laman Utama","item":"https://ahmadalbab.store/"},
        {"@type":"ListItem","position":2,"name":"Artikel","item":"https://ahmadalbab.store/artikel/"},
        {"@type":"ListItem","position":3,"name":item.title}
      ]}
    ]}
  });

  const others = ALL_REVIEWS.filter(r=>r.slug!==item.slug).slice(0,5);

  document.getElementById("app").innerHTML = `
    <nav aria-label="breadcrumb" class="breadcrumb wrap" style="padding-left:0;padding-right:0;">
      <ol style="display:flex;">
        <li><a href="../index.html">Laman Utama</a></li>
        <li aria-hidden="true">/</li>
        <li><a href="./">Artikel</a></li>
        <li aria-hidden="true">/</li>
        <li><span aria-current="page">${esc(item.title)}</span></li>
      </ol>
    </nav>
    <div class="body-grid">
      <article class="article-card">
        <h1>${esc(item.title)}</h1>
        <div class="article-meta">
          <span class="pill">${esc(item.tag||"Panduan")}</span>
          <span>${esc(item.readTime||"")}</span>
          <span>· Ditulis oleh Ahmad Albab</span>
        </div>
        ${item.image
          ? `<figure><img src="${item.image}" alt="${esc(item.title)}" width="1200" height="675"><figcaption>${esc(item.title)}</figcaption></figure>`
          : `<figure><div style="width:100%;aspect-ratio:16/9;border-radius:14px;background:var(--n200);display:flex;align-items:center;justify-content:center;color:var(--n700);font-size:13px;font-weight:600;">Gambar utama artikel (1200×675)</div></figure>`}
        ${item.excerpt ? `<p style="margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--n700);">Ringkasan</p><p class="lede">${esc(item.excerpt)}</p>` : ""}
        <div class="article-body">${paragraphs(item.body)}</div>
        <div class="inline-cta">
          <div>
            <p>Nak tengok produk yang kami sebut dalam artikel ni?</p>
            <p style="font-weight:500;color:var(--accent-800);font-size:13px;margin-top:4px;">Senarai pilihan kami ada di laman utama, lengkap dengan harga terkini.</p>
          </div>
          <a href="../index.html#produk">Lihat pilihan kami</a>
        </div>
        <p class="disclosure">Nota: kami tidak menguji setiap produk secara peribadi. Ulasan ini berdasarkan spesifikasi penjual, rating dan ulasan pembeli sebenar di Shopee dan TikTok Shop. Sesetengah link adalah link affiliate.</p>
      </article>
      <aside>
        <div class="side-card">
          <h2>Cari Artikel</h2>
          <form action="./" method="get" role="search" style="display:flex;align-items:center;gap:10px;border:1px solid var(--n300);border-radius:999px;padding:0 8px 0 14px;height:46px;background:var(--bg);">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" style="flex:none;color:var(--n700);"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
            <input type="search" name="q" aria-label="Cari artikel" placeholder="Cari tajuk atau topik…" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font-family:inherit;font-size:15px;color:var(--text);height:42px;">
            <button type="submit" aria-label="Cari" style="flex:none;width:34px;height:34px;border:0;border-radius:999px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
            </button>
          </form>
        </div>
        <div class="side-card">
          <h2>Artikel Terkini</h2>
          <p style="margin-bottom:10px;">Ulasan lain yang mungkin berguna.</p>
          <div class="recent-list">
            ${others.length ? others.map(r=>`<a href="${encodeURIComponent(r.slug||'')}/">${esc(r.title)}<span>${esc(r.readTime||"")}</span></a>`).join("") : `<span style="font-size:13px;color:var(--n700);">Belum ada artikel lain.</span>`}
          </div>
          <a class="outline-link" href="./">Semua artikel</a>
        </div>
      </aside>
    </div>`;
}

function renderNotFound(){
  document.getElementById("app").innerHTML = `<div class="empty-card" style="margin:32px 0;"><h2>Artikel tak dijumpai</h2><p>Mungkin artikel ni dah dibuang atau link tak betul.</p><a class="btn-primary" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;" href="./">Lihat semua artikel</a></div>`;
}

// ====================== BOOT ======================
function fetchWithTimeout(url, ms, attempts){
  attempts = attempts || 3;
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  return fetch(url, { signal: controller.signal })
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .catch(err=>{
      if(attempts <= 1) return {items:[]};
      return new Promise(resolve=>setTimeout(resolve, 1000)).then(()=>fetchWithTimeout(url, ms, attempts-1));
    })
    .finally(()=>clearTimeout(timer));
}

Promise.all([
  fetchWithTimeout(API_URL + "?action=getContent&type=review", 8000, 3),
  fetchWithTimeout(API_URL + "?action=getContent&type=digital", 8000, 3)
]).then(([reviewsRes, digitalRes])=>{
  ALL_REVIEWS = (reviewsRes.items || []).map(r=>({ title:r.title||"", tag:r.tag||"Panduan", readTime:r.readTime||"", excerpt:r.excerpt||"", body:r.body||"", image:r.image||"", slug:r.slug||"" }));
  DIGITAL_LINKS = (digitalRes.items || []).slice(0,3);

  const slug = slugParam();
  if(slug){
    const item = ALL_REVIEWS.find(x=>x.slug===slug);
    if(item) renderArticle(item); else renderNotFound();
  } else {
    renderList();
  }
}).catch(()=>{ renderNotFound(); });
</script>
</body>
